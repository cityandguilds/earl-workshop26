{% extends "base.html" %}

{% block title %}Sign in · {{ workshop.title }}{% endblock %}

{% block content %}
<section class="auth-card" aria-labelledby="login-title">
  <h1 id="login-title">Sign in</h1>
  <p>Use your sign-in username, not your display name.</p>
  {% if login_error %}<p class="form-error" role="alert">{{ login_error }}</p>{% endif %}
  <form method="post" action="/login" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next_path" value="{{ next_path }}">
    <label for="username">Sign-in username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
