[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "earl-workshop26"
version = "0.3.0"
description = "A small, branded workshop portal for the EARL 2026 workshop."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "cryptography>=43,<47",
    "itsdangerous>=2.2,<3.0",
    "jinja2>=3.1,<4.0",
    "markdown-it-py>=3.0,<5.0",
    "pwdlib[argon2]>=0.2.1,<1.0",
    "pygments>=2.19,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
earl-workshop = "earl_workshop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/earl_workshop"]

[tool.hatch.build.targets.wheel.force-include]
"content" = "earl_workshop/content"
"resources" = "earl_workshop/resources"
"assets" = "earl_workshop/brand_assets"

[tool.hatch.build.targets.sdist]
include = [
    "/assets",
    "/content",
    "/resources",
    "/src",
    "/tests",
    "/.gitignore",
    "/.env.example",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
